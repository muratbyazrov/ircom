    <text x="110" y="212" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">QR / app link</text>
  </g>

  <text x="126" y="534" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="15">IRCOM • web app • 2026</text>
